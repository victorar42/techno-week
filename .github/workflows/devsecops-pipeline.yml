# ┌─────────────────────────────────────────────────────────────┐
# │  🔒 Pipeline DevSecOps Spec-Driven                         │
# │                                                             │
# │  Este workflow se ejecuta en cada Pull Request y valida     │
# │  6 capas de seguridad derivadas de la OpenAPI Spec.         │
# │  Si cualquier check falla, el PR no se puede mergear.       │
# │                                                             │
# │  Etapas:                                                    │
# │  1. Spectral  → Linting de la OpenAPI Spec                 │
# │  2. SAST      → Análisis estático del código (Semgrep)     │
# │  3. Secrets   → Detección de secretos (Gitleaks)           │
# │  4. Deps      → Vulnerabilidades en dependencias            │
# │  5. DAST      → Pruebas dinámicas (OWASP ZAP)             │
# │  6. Report    → Reporte de compliance en el PR              │
# └─────────────────────────────────────────────────────────────┘

name: "🔒 DevSecOps Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  # ════════════════════════════════════════════════════════════
  # ETAPA 1: Lint de la OpenAPI Spec con Spectral
  # ════════════════════════════════════════════════════════════
  spec-lint:
    name: "📋 Spectral — Lint OpenAPI Spec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Spectral
        uses: stoplightio/spectral-action@latest
        with:
          file_glob: "openapi.yaml"
          spectral_ruleset: ".spectral/.spectral-banking.yaml"

  # ════════════════════════════════════════════════════════════
  # ETAPA 2: Análisis Estático (SAST) con Semgrep
  # ════════════════════════════════════════════════════════════
  sast:
    name: "🔍 Semgrep — SAST Analysis"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --severity ERROR --json --output semgrep-results.json || true
        env:
          SEMGREP_RULES: "p/owasp-top-ten p/nodejs p/jwt p/security-audit"

      - name: Check for critical findings
        run: |
          if [ -f semgrep-results.json ]; then
            ERROR_COUNT=$(cat semgrep-results.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r['extra']['severity']=='ERROR']))" 2>/dev/null || echo "0")
            echo "Critical findings: $ERROR_COUNT"
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "::error::Semgrep found $ERROR_COUNT critical security issue(s)"
              exit 1
            fi
          fi

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ════════════════════════════════════════════════════════════
  # ETAPA 3: Detección de Secretos con Gitleaks
  # ════════════════════════════════════════════════════════════
  secrets:
    name: "🔑 Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════
  # ETAPA 4: Análisis de Dependencias
  # ════════════════════════════════════════════════════════════
  dependency-check:
    name: "📦 Dependencies — Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate --json > audit-results.json || true

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high vulnerabilities"
            exit 1
          fi

      - name: Upload dependency results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.json

  # ════════════════════════════════════════════════════════════
  # ETAPA 5: Pruebas Dinámicas (DAST) con OWASP ZAP
  # ════════════════════════════════════════════════════════════
  dast:
    name: "⚡ OWASP ZAP — DAST Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and start API
        run: |
          npm ci
          npm start &
          for i in $(seq 1 10); do curl -sf http://localhost:3000/health && break || sleep 1; done

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "http://localhost:3000/api/v1"
          format: openapi
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: zap-report.html

  # ════════════════════════════════════════════════════════════
  # ETAPA 6: Generar Reporte de Compliance
  # ════════════════════════════════════════════════════════════
  compliance-report:
    name: "📊 Compliance Report"
    runs-on: ubuntu-latest
    needs: [spec-lint, sast, secrets, dependency-check, dast]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate compliance report
        id: report
        env:
          SPEC_LINT: ${{ needs.spec-lint.result }}
          SAST: ${{ needs.sast.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPS: ${{ needs.dependency-check.result }}
          DAST: ${{ needs.dast.result }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Map status to emoji
          status_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "⚠️" ;;
            esac
          }

          # Determine overall result
          ALL_PASSED=true
          for result in "$SPEC_LINT" "$SAST" "$SECRETS" "$DEPS" "$DAST"; do
            if [ "$result" != "success" ]; then
              ALL_PASSED=false
              break
            fi
          done

          if [ "$ALL_PASSED" = true ]; then
            OVERALL="✅ **ALL CHECKS PASSED** — Ready to merge"
          else
            OVERALL="❌ **CHECKS FAILED** — Fix issues before merging"
          fi

          # Build report
          cat > report.md << EOF
          ## 🔒 DevSecOps Compliance Report

          **Commit:** \`${COMMIT_SHA:0:7}\` | **Date:** $(date -u '+%Y-%m-%d %H:%M UTC') | **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          | Check | Status | Tool |
          |-------|--------|------|
          | OpenAPI Spec Lint | $(status_emoji "$SPEC_LINT") $SPEC_LINT | Spectral |
          | Static Analysis (SAST) | $(status_emoji "$SAST") $SAST | Semgrep |
          | Secret Detection | $(status_emoji "$SECRETS") $SECRETS | Gitleaks |
          | Dependency Scan | $(status_emoji "$DEPS") $DEPS | npm audit |
          | Dynamic Testing (DAST) | $(status_emoji "$DAST") $DAST | OWASP ZAP |

          **Result:** $OVERALL

          ---
          *Generated automatically by the DevSecOps Pipeline*
          EOF

          cat report.md

          # Set output for the fail step
          echo "all_passed=$ALL_PASSED" >> "$GITHUB_OUTPUT"

      - name: Post report to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: run-${{ github.run_id }}
          path: report.md

      - name: Fail if checks did not pass
        if: steps.report.outputs.all_passed != 'true'
        run: |
          echo "::error::One or more DevSecOps checks failed. Fix the issues and push again."
          exit 1
