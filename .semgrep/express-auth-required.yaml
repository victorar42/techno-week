rules:
  - id: express-route-without-auth-middleware
    patterns:
      - pattern: app.use($PATH, $HANDLER)
      - pattern-not: app.use($PATH, authMiddleware, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: ".*/api/v1/.*"
    message: >
      Ruta Express montada sin middleware de autenticación.
      Todos los endpoints de API deben estar protegidos con authMiddleware.
      OWASP A01:2021 - Broken Access Control.
    languages: [javascript]
    severity: ERROR
    metadata:
      category: security
      technology:
        - express
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-306: Missing Authentication for Critical Function"
