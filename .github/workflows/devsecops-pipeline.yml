# ┌─────────────────────────────────────────────────────────────┐
# │  🔒 Pipeline DevSecOps Spec-Driven                         │
# │                                                             │
# │  Este workflow se ejecuta en cada Pull Request y valida     │
# │  6 capas de seguridad derivadas de la OpenAPI Spec.         │
# │  Si cualquier check falla, el PR no se puede mergear.       │
# │                                                             │
# │  Etapas:                                                    │
# │  1. Spectral  → Linting de la OpenAPI Spec                 │
# │  2. SAST      → Análisis estático del código (Semgrep)     │
# │  3. Secrets   → Detección de secretos (Gitleaks)           │
# │  4. Deps      → Vulnerabilidades en dependencias            │
# │  5. DAST      → Pruebas dinámicas (OWASP ZAP)             │
# │  6. Report    → Reporte de compliance en el PR              │
# └─────────────────────────────────────────────────────────────┘

name: "🔒 DevSecOps Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ════════════════════════════════════════════════════════════
  # ETAPA 1: Lint de la OpenAPI Spec con Spectral
  # ════════════════════════════════════════════════════════════
  spec-lint:
    name: "📋 Spectral — Lint OpenAPI Spec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Spectral
        uses: stoplightio/spectral-action@latest
        with:
          file_glob: "openapi.yaml"
          spectral_ruleset: ".spectral/.spectral-banking.yaml"

  # ════════════════════════════════════════════════════════════
  # ETAPA 2: Análisis Estático (SAST) con Semgrep
  # ════════════════════════════════════════════════════════════
  sast:
    name: "🔍 Semgrep — SAST Analysis"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep ci --config auto --config p/owasp-top-ten --config p/nodejs --json --output semgrep-results.json
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/nodejs
            p/jwt
            p/security-audit

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ════════════════════════════════════════════════════════════
  # ETAPA 3: Detección de Secretos con Gitleaks
  # ════════════════════════════════════════════════════════════
  secrets:
    name: "🔑 Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════
  # ETAPA 4: Análisis de Dependencias
  # ════════════════════════════════════════════════════════════
  dependency-check:
    name: "📦 Dependencies — Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate --json > audit-results.json || true

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high vulnerabilities"
            exit 1
          fi

      - name: Upload dependency results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.json

  # ════════════════════════════════════════════════════════════
  # ETAPA 5: Pruebas Dinámicas (DAST) con OWASP ZAP
  # ════════════════════════════════════════════════════════════
  dast:
    name: "⚡ OWASP ZAP — DAST Scan"
    runs-on: ubuntu-latest
    needs: [spec-lint] # Solo correr DAST si la spec es válida
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and start API
        run: |
          npm ci
          npm start &
          sleep 5
          curl -f http://localhost:3000/health || exit 1

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "http://localhost:3000/api/v1"
          format: openapi
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I -z '-config api.disablekey=true'"

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: zap-report.html

  # ════════════════════════════════════════════════════════════
  # ETAPA 6: Generar Reporte de Compliance
  # ════════════════════════════════════════════════════════════
  compliance-report:
    name: "📊 Compliance Report"
    runs-on: ubuntu-latest
    needs: [spec-lint, sast, secrets, dependency-check, dast]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate compliance report
        id: report
        run: |
          # Collect job statuses
          SPEC_LINT="${{ needs.spec-lint.result }}"
          SAST="${{ needs.sast.result }}"
          SECRETS="${{ needs.secrets.result }}"
          DEPS="${{ needs.dependency-check.result }}"
          DAST="${{ needs.dast.result }}"

          # Map status to emoji
          status_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "⚠️" ;;
            esac
          }

          # Build report
          cat > report.md << 'REPORT_EOF'
          ## 🔒 DevSecOps Compliance Report

          | Check | Status | Tool |
          |-------|--------|------|
          REPORT_EOF

          echo "| OpenAPI Spec Lint | $(status_emoji $SPEC_LINT) $SPEC_LINT | Spectral |" >> report.md
          echo "| Static Analysis (SAST) | $(status_emoji $SAST) $SAST | Semgrep |" >> report.md
          echo "| Secret Detection | $(status_emoji $SECRETS) $SECRETS | Gitleaks |" >> report.md
          echo "| Dependency Scan | $(status_emoji $DEPS) $DEPS | npm audit |" >> report.md
          echo "| Dynamic Testing (DAST) | $(status_emoji $DAST) $DAST | OWASP ZAP |" >> report.md

          echo "" >> report.md
          echo "---" >> report.md
          echo "*Generated automatically by the DevSecOps Pipeline*" >> report.md
          echo "*Spec-driven security powered by OpenAPI + GitHub Actions*" >> report.md
          echo "" >> report.md
          echo "> 📋 Full artifacts available in the Actions tab" >> report.md

          cat report.md

      - name: Post report to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: report.md
